plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'br.com.develox.yoinks'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.develox.yoinks'
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName '0.5.0'
        ndk {
            // -Pabi=arm64-v8a builds the phone-only APK; default keeps the emulator ABI too.
            abiFilters(*((project.findProperty('abi') ?: 'arm64-v8a,x86_64').split(',')))
        }
    }
    // Release signing key lives outside the repo. Override the location with
    // -PyoinksKeystore=/path/keystore.properties. Without it, release builds are unsigned.
    def keystoreFile = file(project.findProperty('yoinksKeystore')
            ?: "${System.getProperty('user.home')}/.config/yoinks-android/keystore.properties")
    if (keystoreFile.exists()) {
        def keystore = new Properties()
        keystoreFile.withInputStream { keystore.load(it) }
        signingConfigs {
            release {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
    buildFeatures {
        buildConfig true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
